name: Deploy

# Deploy the backend to Cloud Run only after CI succeeds on main.
# Auth uses Workload Identity Federation (no long-lived key).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sheetnotify-api \
            --source backend \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --add-cloudsql-instances sheetnotify-500318:us-central1:sheetnotify-db \
            --min-instances=1 \
            --no-cpu-throttling \
            --update-env-vars FRONTEND_URL=https://sheet-notify.vercel.app \
            --quiet
