name: Deploy

# Deploy the backend to Cloud Run only after CI succeeds on main.
# Auth uses Workload Identity Federation (no long-lived key).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sheetnotify-api \
            --source backend \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --min-instances=0 \
            --cpu-throttling \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --update-env-vars FRONTEND_URL=https://sheet-notify.vercel.app \
            --quiet

      - name: Smoke test (post-deploy health)
        run: |
          URL=$(gcloud run services describe sheetnotify-api \
            --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Health-checking $URL/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health" | grep -q healthy; then
              echo "✅ Service healthy"; exit 0
            fi
            echo "attempt $attempt: not healthy yet, retrying..."; sleep 5
          done
          echo "❌ Service did not report healthy after deploy"; exit 1

      - name: Alert on failure (Telegram)
        if: failure() && vars.TELEGRAM_ALERT_CHAT_ID != ''
        run: |
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ vars.TELEGRAM_ALERT_CHAT_ID }}" \
            --data-urlencode "text=❌ SheetNotify CD deploy FAILED on main.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
